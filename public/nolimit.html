        .back-button {

            margin-bottom: 5px;

            text-shadow: 0 4px 15px rgba(0,0,0,0.3);

        .filter-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            width: min(100%, 700px);
            margin-left: auto;
            margin-right: auto;

        .search-box {

            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);

            border: 2px solid rgba(154, 187, 172, 0.5);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
            cursor: pointer;

            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 2.7em;
        }

        .rtp-display {
            display: flex;
            align-items: center;
            gap: 0;
            margin-bottom: 12px;
        }

        .rtp-text {
            flex: 0 0 54px;

            font-size: 0.9rem;
            font-weight: 800;
            text-align: left;
            letter-spacing: 0.03em;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
        }

        .rtp-bar {
            --rtp-color-start: #ff3b30;
            --rtp-color-end: #c71f16;
            --rtp-fill: 50%;
            position: relative;
            flex: 1;
            min-width: 0;
            height: 32px;
            padding: 4px;
            border-radius: 999px;
            background: #071b24;
            border: 4px solid var(--rtp-color-end);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.08),
                0 0 14px color-mix(in srgb, var(--rtp-color-end) 45%, transparent);
            overflow: hidden;
        }

        .rtp-bar-fill {
            position: relative;
            z-index: 1;
            width: var(--rtp-fill);
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--rtp-color-start), var(--rtp-color-end));
            overflow: hidden;
            transition: width 0.35s ease;
        }

        .rtp-bar-fill::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(7, 27, 36, 0.96) 0 2px,
                    transparent 2px 10px,
                    rgba(7, 27, 36, 0.96) 10px 12px
                );
            mix-blend-mode: multiply;
            opacity: 0.95;
        }

        .rtp-bar-track {
            position: absolute;
            inset: 4px;
            z-index: 0;
            border-radius: 999px;
            background:
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.05) 0 2px,
                    transparent 2px 10px,
                    rgba(255, 255, 255, 0.05) 10px 12px
                ),
                linear-gradient(90deg, rgba(6, 18, 27, 0.75), rgba(6, 18, 27, 0.9));
            pointer-events: none;
        }

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

            align-items: center;

            border-color: rgba(0, 255, 136, 1);

            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);

            justify-content: center;
            align-items: center;

            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 90%;

            align-items: center;

            font-size: 1.8rem;

            gap: 12px;

        .pola-item {

        .jam-item {

            padding: 40px 20px;
            display: none;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes aurora-drift {
            0% { transform: translate3d(-2%, -1%, 0) scale(1); }
            50% { transform: translate3d(2%, 2%, 0) scale(1.08); }
            100% { transform: translate3d(-1%, 3%, 0) scale(1.02); }
        }

        @keyframes traces-drift {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-90px, -50px, 0); }
        }

        @keyframes scan-sweep {
            0% {
                background-position: 120% 0, 0 -40%;
                opacity: 0.35;
            }
            50% {
                background-position: 40% 0, 0 55%;
                opacity: 0.82;
            }
            100% {
                background-position: -30% 0, 0 140%;
                opacity: 0.35;
            }
        }

        @keyframes pulse-flicker {
            0% {
                opacity: 0.45;
                transform: scale(1);
            }
            35% {
                opacity: 0.95;
                transform: scale(1.02);
            }
            100% {
                opacity: 0.65;
                transform: scale(0.98);
            }
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #ffd700, #ff6b6b);
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 1.8rem;
                margin-bottom: 25px;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .filter-section {
                gap: 12px;
                width: 100%;
                max-width: 520px;
            }

            .container {
                padding: 100px 15px 30px;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            .games-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .game-image {
                height: 150px;
            }

            .game-info {
                padding: 10px;
            }

            .back-button {
                padding: 8px 12px;
                font-size: 0.9rem;
                flex-shrink: 0;
            }

            .filter-section {
                gap: 10px;
                width: 100%;
            }

            .search-box {
                padding: 10px 14px;
                font-size: 0.95rem;
            }

            .tech-traces {
                background-size: 620px 500px;
                opacity: 0.44;
            }

            .tech-grid {
                background-size: 48px 48px;
            }
        }
    </style>
</head>
